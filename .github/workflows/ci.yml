name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  ASSEMBLY: NyaLauncher.Avalonia

jobs:
  # 推送 / PR：快速编译校验
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore NyaLauncher.slnx

      - name: Build
        run: dotnet build NyaLauncher.slnx -c Release --no-restore

  # 打 tag（v*）：三平台自包含单文件发布
  publish:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: NyaLauncher-Windows-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            artifact: NyaLauncher-Linux-x64.tar.gz
          - os: macos-latest
            rid: osx-x64
            artifact: NyaLauncher-macOS-x64.tar.gz
          - os: macos-latest
            rid: osx-arm64
            artifact: NyaLauncher-macOS-ARM64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (${{ matrix.rid }})
        run: >
          dotnet publish NyaLauncher.Avalonia/NyaLauncher.Avalonia.csproj
          -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Pack archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath ${{ matrix.artifact }}

      # Windows 额外提供免解压的裸单文件 exe
      - name: Stage single-file exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item publish/${{ env.ASSEMBLY }}.exe NyaLauncher-Windows-x64.exe

      - name: Pack archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "${{ matrix.artifact }}" -C publish .

      # Linux 额外提供 deb 包（安装到 /opt/nya-launcher，/usr/bin 提供启动命令）
      - name: Install fpm
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential
          sudo gem install --no-document fpm

      - name: Build deb
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          mkdir -p stage/opt/nya-launcher stage/usr/bin
          cp -r publish/* stage/opt/nya-launcher/
          cat > stage/usr/bin/nya-launcher <<'EOF'
          #!/bin/bash
          exec /opt/nya-launcher/NyaLauncher.Avalonia "$@"
          EOF
          chmod +x stage/usr/bin/nya-launcher
          fpm -s dir -t deb -n nya-launcher -v "$version" \
            -m "NyaLauncher <noreply@nyalauncher.local>" \
            --description "NyaLauncher - A modern cross-platform lightweight Minecraft launcher" \
            --url "https://github.com/${{ github.repository }}" \
            --license "Apache-2.0" --force -C stage --architecture amd64

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: NyaLauncher-Windows-x64-singlefile
          path: NyaLauncher-Windows-x64.exe

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: NyaLauncher-Linux-x64-deb
          path: nya-launcher_*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # 打 tag：自动创建 GitHub Release 并附上三平台产物
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
